# GitHub Actions workflow for Chat With Your PDF.
#
# What this does: every time you push code or open a pull request, GitHub spins up
# a fresh Linux machine, installs Python and your dependencies, and runs the tests.
# Pass -> green checkmark on the commit. Fail -> a red X and a log to read.
# It's free on public repos.
#
# Why it's safe to run in the cloud: all 25 tests run FULLY OFFLINE -- the default
# hashing embedder and the extractive answer need no API key and no downloads. So
# this workflow needs no secrets at all. Nothing here touches a paid service.
#
# WHERE THIS FILE GOES: copy it to ".github/workflows/ci.yml" at the ROOT of your
# repo (the repo root is the whole 08-chat-with-your-pdf/ folder, the one that
# contains build_from_scratch/). GitHub only runs workflow files that live under
# .github/workflows/.

# The name shown in the repo's "Actions" tab.
name: CI

# "on" decides WHEN this runs. Here: on every push, and on every pull request.
on:
  push:
  pull_request:

# A workflow is made of one or more "jobs". We have one job, called "test".
jobs:
  test:
    # The kind of machine to run on. ubuntu-latest is a standard, free Linux box.
    # The tests are pure Python, so they pass on Linux even though you develop on Windows.
    runs-on: ubuntu-latest

    # "steps" run top to bottom on that machine.
    steps:
      # Step 1: download your repo's code onto the runner. Without this, the machine
      # is empty and has nothing to test. "uses" pulls in a prebuilt, official action.
      - name: Check out the code
        uses: actions/checkout@v4

      # Step 2: install Python. Pin a version so CI matches what you develop against.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Cache pip downloads between runs so installs are faster. Point the cache
          # at the requirements file, which lives inside build_from_scratch/.
          cache: pip
          cache-dependency-path: build_from_scratch/requirements.txt

      # Step 3: install the project's dependencies. The requirements file is one
      # level down in build_from_scratch/, so give pip the full path from the repo
      # root. ("--upgrade pip" just makes sure pip itself is current first.)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r build_from_scratch/requirements.txt

      # Step 4: run the tests. pyproject.toml inside build_from_scratch/ sets
      # testpaths = ["tests"], so a bare "pytest" run from that folder finds and runs
      # the whole suite. "working-directory" moves us into build_from_scratch first.
      # The job passes only if every test passes.
      - name: Run tests
        working-directory: build_from_scratch
        run: pytest
