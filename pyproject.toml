[project]
name = "pdf-chat"
version = "0.1.0"
description = "Chat With Your PDF -- a readable, offline-first RAG engine with citations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pypdf>=4.0",
    "streamlit>=1.30",
]

[project.optional-dependencies]
real = ["litellm>=1.40", "sentence-transformers>=2.7", "chromadb>=0.5"]
test = ["pytest>=8.0"]

[project.scripts]
pdf-chat = "pdf_chat.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pdf_chat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
